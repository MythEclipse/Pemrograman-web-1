version: 2
updates:
  # The old config pointed at `directory: "/"` with no root package.json, and
  # at three /services/* directories that have never existed here — so
  # Dependabot was silently updating nothing. It now covers the workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    labels: [dependencies]
    # Stops Dependabot PROPOSING versions that are too young for the bundled
    # pnpm's default 1440-minute `minimumReleaseAge`. Paired with
    # `minimumReleaseAge: 0` in pnpm-workspace.yaml: this half keeps young
    # releases out of the queue, that half stops the install failing if one
    # slips past. hub needs both for the same reason. See the comment there.
    cooldown:
      default-days: 3
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    # Same cooldown rationale. Action tags are published and then re-tagged, so
    # a floating `v7`-style major is often days old at the moment Dependabot
    # resolves it.
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
